name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: .NET 10 backend
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Advisor_CI_Only_947!password
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Advisor_CI_Only_947!password' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Advisor_CI_Only_947!password' -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/SqlServerAdvisor.slnx
      - name: Build
        run: dotnet build backend/SqlServerAdvisor.slnx --configuration Release --no-restore

      - name: Analysis and SQL compatibility checks
        env:
          SQLADVISOR_TEST_CONNECTION: Server=localhost,1433;Database=master;User ID=sa;Password=Advisor_CI_Only_947!password;TrustServerCertificate=true
        run: dotnet run --project backend/tests/SqlServerAdvisor.Checks --configuration Release --no-build -- .

  frontend:
    name: Angular 22 frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build

  deployment:
    name: Deployment scripts and settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem 'deploy' -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Syntax errors in $($_.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Error $_.Message }
            }
            else {
              Write-Host "$($_.Name) syntax OK"
            }
          }
          if ($failed) { exit 1 }
      - name: Validate centralized install settings
        shell: pwsh
        run: |
          $path = 'deploy/install.settings.json'
          $settings = Get-Content -Raw $path | ConvertFrom-Json
          foreach ($section in @('installation','web','certificate','database','build')) {
            if ($null -eq $settings.PSObject.Properties[$section]) {
              throw "Missing settings section: $section"
            }
          }
          if ($settings.web.protocol -notin @('http','https')) {
            throw 'web.protocol must be http or https'
          }
          if ($settings.certificate.mode -notin @('auto','thumbprint','pfx')) {
            throw 'certificate.mode must be auto, thumbprint or pfx'
          }
          if ([string]::IsNullOrWhiteSpace([string]$settings.installation.installRoot)) {
            throw 'installation.installRoot is required'
          }
          if ([string]::IsNullOrWhiteSpace([string]$settings.web.hostName)) {
            throw 'web.hostName is required'
          }
          Write-Host 'deploy/install.settings.json validation OK'
