name: Materialize source package

on:
  push:
    paths:
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate chunks
        shell: bash
        run: |
          set -euo pipefail
          check(){ f="$1"; l="$2"; h="$3"; tr -cd 'A-Za-z0-9+/=' < "packages/$f.b64" > "/tmp/$f.b64"; test "$(wc -c < /tmp/$f.b64 | tr -d ' ')" = "$l"; test "$(sha256sum /tmp/$f.b64 | awk '{print $1}')" = "$h"; echo "$f OK"; }
          check part00 12000 d8ba1b4fbdc11e755ee90a5e828f1f44fb85b24d6080f4387e74101acffb089a
          check part010a 2000 e594178c3c5516161bcc9294a01400902349d5ed7246ef26c89a677d67851082
          check part010b 2000 b8b8ffb66904b875e0d64446854db7211b097ded364fedd1431ff0c7593f9b92
          check part011 4000 571faa517e11135187e72133eb275970de5d23ab788382444a874f066c6b152b
          check part012 4000 66a002cebd1c507bbc991c44fb12e3ce466079ecd42c357cdc3045c611f96aaa
          check part02 12000 71ce89dc9e3593da66da9622e5886af69e0d5174dccec98046c134cba4a64a2b
          check part03 12000 416e9675d8dfe719095401e9513a74b13610fa12c819f7e6515693a27194cfdf
          check part040 2000 8622068105639d80771fa7e2a35a2204c37cf4043d06a991c403c65cbd59b0f8
          check part041 2000 364b90a8b7efdcb870525819a0c6ca2b3499fbf9d7890b2834615adf4436e2f4
          check part042 2000 c0426ec74b1fb8b764e1ed35388a6bc489c1b01a1759c95ed904d51d928e4bee
          check part043 2000 7578160ea636082e805a2195ed574ed326c977655af64c9635f21c3fca2c5895
          check part044 2000 595a67ba3f7222e189a5c29fe22dbe35ff03ddf956926214b5235a7e029ef9d0
          check part045 2000 f664df464a253fc39eca6b08090cf3124d4218632c8f298286ec82a420124ae1
          check part050 4000 a992aea5d7d68c73f1a37d79f642eb2522452f8f35a364497911853ed29fdcc4
          check part051 4000 799339a52ebbc7089617dc75ab57daaf97698c0692e5870c7cf965acbe7396a3
          check part052 4000 a1ceb6982a0d39d1165e8fb1b0b0892dccc278f8ffb9ef43a2d2bd10ac9b72a6
          check part060 4000 e258ff54f7dc8ac7e4e71f00475299f1f520f3af5c88caa328026cdd96abf774
          check part061 4000 05f3f5584dbe1385acbe1c5c665032affbf96393ee92756c878f965045ee832d
          check part062 4000 24a0ff4885beb96ff6b3f2193faaed5a80ab854f5d102a926f23a6acfab6e452
          check part070 4000 54c06e2aed26491009fa722492331862a6b5285b7c905cc3afae1f479731ae6a
          check part071 4000 5f48567b4b71e61a73dbd32317d8535c1c2dfa6f6b752ca7961bba4eef929aa8
          check part0720 2000 db702ff59d70c8ecf37bd9a7e37238b0c38354b77b25402b5317ec66a9194d2f
          check part0721 2000 2f52127e032ea178a85ce40907d505c21214227145ff78f35a38734dcd1abaac
          check part08 416 c78d60e2b2e35030d3e5332d0f5106a3d8f38bfcd43d9eb5b0d4cafb834ee79e
      - name: Rebuild archive
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/part00.b64 /tmp/part010a.b64 /tmp/part010b.b64 /tmp/part011.b64 /tmp/part012.b64 /tmp/part02.b64 /tmp/part03.b64 /tmp/part040.b64 /tmp/part041.b64 /tmp/part042.b64 /tmp/part043.b64 /tmp/part044.b64 /tmp/part045.b64 /tmp/part050.b64 /tmp/part051.b64 /tmp/part052.b64 /tmp/part060.b64 /tmp/part061.b64 /tmp/part062.b64 /tmp/part070.b64 /tmp/part071.b64 /tmp/part0720.b64 /tmp/part0721.b64 /tmp/part08.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          unzip -t /tmp/project.zip
      - name: Materialize source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/extract && mkdir /tmp/extract
          unzip -q /tmp/project.zip -d /tmp/extract
          test -d /tmp/extract/app/backend
          test -d /tmp/extract/app/frontend
          test -d /tmp/extract/app/database
          rsync -a --exclude '.github' /tmp/extract/app/ ./
          rm -rf packages
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SQL Server Advisor Bot'
          git config user.email '83568648+Onur3@users.noreply.github.com'
          git add -A
          git commit -m 'Import SQL Server Advisor source'
          git push
