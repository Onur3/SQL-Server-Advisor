name: Materialize source package

on:
  push:
    paths:
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            packages/part00.b64 \
            packages/part01.b64 \
            packages/part02.b64 \
            packages/part03.b64 \
            packages/part04.b64 \
            packages/part050.b64 \
            packages/part051.b64 \
            packages/part052.b64 \
            packages/part060.b64 \
            packages/part061.b64 \
            packages/part062.b64 \
            packages/part070.b64 \
            packages/part071.b64 \
            packages/part072.b64 \
            packages/part08.b64 \
            | tr -d '[:space:]' > /tmp/sql-server-advisor.b64
          base64 --decode /tmp/sql-server-advisor.b64 > /tmp/sql-server-advisor.zip
          unzip -t /tmp/sql-server-advisor.zip

      - name: Materialize repository tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sql-advisor-extract
          mkdir -p /tmp/sql-advisor-extract
          unzip -q /tmp/sql-server-advisor.zip -d /tmp/sql-advisor-extract
          test -d /tmp/sql-advisor-extract/app/backend
          test -d /tmp/sql-advisor-extract/app/frontend
          test -d /tmp/sql-advisor-extract/app/database
          rsync -a --exclude '.github' /tmp/sql-advisor-extract/app/ ./
          rm -rf packages

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SQL Server Advisor Bot'
          git config user.email '83568648+Onur3@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Import SQL Server Advisor source'
          git push
